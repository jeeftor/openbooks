name: Live IRC Integration Tests

on:
  push:
    branches:
      - master
    paths:
      - "core/**"
      - "irc/**"
      - ".github/workflows/live-irc.yml"
  workflow_dispatch:

jobs:
  live-irc:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run live IRC tests
        run: |
          go test -tags liveirc -v -run TestLiveIRC ./core/ -timeout 120s 2>&1 | tee live-irc-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-irc-test-output
          path: live-irc-output.txt
          retention-days: 7
